name: NLFR proof

on:
  push:
    branches: [main, codex/**, fix/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nlfr-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + generic record + canvas build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/canvas/package-lock.json

      - name: Python tests
        run: uv sync && uv run pytest -q

      - name: NLFR doctor (cache-only)
        # Hosted runners have no nativelink binary; the gate script records the
        # honest environment blocker (doctor.json) instead of failing the job —
        # same contract as nlfr-cache-only-gate.yml.
        run: ./scripts/cache-only-ci-gate.sh

      - name: Tier 1 demo dry-run
        run: |
          NLFR_SKIP_BAZEL=1 ./scripts/tier1-agent-demo.sh --dry-run
          ./scripts/compare-agent-runs.sh --dry-run
          ./scripts/promote-tier1-compare.sh --dry-run || true

      - name: Generic record proof
        run: ./scripts/record-proof.sh

      - name: Canvas dogfood record + build + truth guard
        run: |
          ./scripts/record-canvas-build.sh
          npm ci --prefix apps/canvas
          npm --prefix apps/canvas run build
          npm --prefix apps/canvas run test:truth

      - name: Upload record-proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-proof
          path: |
            data/record-proof/summary.json
            data/record-proof/run.json
            data/record-proof/projections/
          if-no-files-found: warn

  linux-nix-toolchain:
    name: Nix toolchain proofs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cold-warm + agent-loop proofs
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            uv sync
            ./scripts/cold-warm-cache-proof.sh
            ./scripts/agent-loop-proof.sh
          '

      - name: Upload toolchain proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-toolchain-proof
          path: |
            data/cold-warm-proof/summary.json
            data/cold-warm-proof/environment-blocker.json
            data/agent-loop-proof/summary.json
            data/agent-loop-proof/environment-blocker.json
          if-no-files-found: warn

  tier1-bazel:
    name: Tier1 Bazel validation (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Tier1 bugfix + feature bazel tests
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            uv sync
            ./scripts/tier1-bazel-ci-proof.sh
          '

      - name: Upload tier1-bazel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-bazel-ci
          path: |
            data/tier1-bazel-ci/summary.json
            data/tier1-bazel-ci/environment-blocker.json
          if-no-files-found: warn

  lre-proof-probe:
    name: LRE substrate proof
    # Non-blocking: the LRE overlay is version-blocked (see
    # demo/bazel-monorepo/MODULE.lre.bazel) and Magic Nix Cache throttles on
    # cold public runners. Tracked in docs/dags/future-fleet-claims.md.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: LRE substrate proof (nix develop)
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            uv sync
            if ./scripts/lre-proof.sh; then
              test -f data/lre-proof/summary.json
            else
              test -f data/lre-proof/environment-blocker.json
            fi
          '

      - name: Upload LRE probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lre-proof-probe
          path: |
            data/lre-proof/summary.json
            data/lre-proof/probe.json
            data/lre-proof/environment-blocker.json
          if-no-files-found: warn


  lre-nix-ci:
    name: LRE Nix toolchain proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: LRE Nix toolchain proof (nix develop)
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            uv sync
            if ./scripts/lre-nix-toolchain-proof.sh; then
              test -f data/lre-nix-toolchain-proof/summary.json
            else
              test -f data/lre-nix-toolchain-proof/environment-blocker.json
            fi
          '

      - name: Upload LRE Nix toolchain proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lre-nix-toolchain-proof
          path: |
            data/lre-nix-toolchain-proof/summary.json
            data/lre-nix-toolchain-proof/environment-blocker.json
          if-no-files-found: warn

  lre-cold-warm-ci:
    name: LRE cold/warm cache parity proof
    # Non-blocking: same LRE overlay blocker + cold-runner cache throttling as
    # lre-proof-probe. Local Nix runs remain the canonical LRE evidence path.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: LRE cold/warm proof (nix develop)
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            uv sync
            if ./scripts/lre-cold-warm-proof.sh; then
              test -f data/lre-cold-warm-proof/summary.json
            else
              test -f data/lre-cold-warm-proof/environment-blocker.json
            fi
          '

      - name: Upload LRE cold/warm proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lre-cold-warm-proof
          path: |
            data/lre-cold-warm-proof/summary.json
            data/lre-cold-warm-proof/environment-blocker.json
            data/lre-cold-warm-proof/projections/
          if-no-files-found: warn

  verify-demo-fixture:
    name: Fixture demo path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/canvas/package-lock.json

      - name: Verify demo (fixture path)
        run: |
          npm ci --prefix apps/canvas
          ./scripts/verify-demo.sh

      - name: Upload demo proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-proof
          path: |
            data/demo-proof/summary.json
            data/demo-proof/projections/
          if-no-files-found: warn
