[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nativelink-agent-flight-recorder"
version = "0.2.1"
description = "Local-first proof recorder for NativeLink-backed Bazel validation runs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alec Maliwanag" }]
keywords = [
  "bazel",
  "nativelink",
  "remote-execution",
  "remote-caching",
  "build-evidence",
  "provenance",
  "ci",
  "agent",
  "proof",
  "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
# Runtime dependencies are intentionally empty: NLFR is stdlib-only by design,
# a deliberate security posture. Do NOT add runtime dependencies here.
dependencies = []

[project.urls]
Homepage = "https://github.com/heyitsalec/nativelink-agent-flight-recorder"
Repository = "https://github.com/heyitsalec/nativelink-agent-flight-recorder"
Issues = "https://github.com/heyitsalec/nativelink-agent-flight-recorder/issues"

[project.scripts]
nlfr = "nlfr.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlfr"]

[tool.hatch.build.targets.sdist]
# Leading-slash anchors keep the sdist minimal: gitignore-style patterns match
# at any depth, so a bare "README.md" would pull in every nested README.
include = [
  "/src/nlfr",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
