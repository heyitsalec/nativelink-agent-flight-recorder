[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nativelink-agent-flight-recorder"
version = "0.2.1"
description = "Local-first proof recorder for NativeLink-backed Bazel validation runs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alec Maliwanag" }]
keywords = [
  "bazel",
  "nativelink",
  "remote-execution",
  "remote-caching",
  "build-evidence",
  "provenance",
  "ci",
  "agent",
  "proof",
  "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
# Runtime dependencies are intentionally empty: NLFR is stdlib-only by design,
# a deliberate security posture. Do NOT add runtime dependencies here.
dependencies = []

[project.urls]
Homepage = "https://github.com/heyitsalec/nativelink-agent-flight-recorder"
Repository = "https://github.com/heyitsalec/nativelink-agent-flight-recorder"
Issues = "https://github.com/heyitsalec/nativelink-agent-flight-recorder/issues"

[project.scripts]
nlfr = "nlfr.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  # Dev-only: contract enforcement tests validate real exporter output against
  # contracts/*.v1.json (JSON Schema Draft 2020-12). NOT a runtime dependency —
  # NLFR stays stdlib-only at runtime (see project.dependencies).
  "jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlfr"]

# Ship the demo simulate fixtures INSIDE the wheel so `nlfr simulate` resolves
# them via importlib.resources with no source checkout present (GitHub #94).
# demo/ stays the single source of truth (no duplicated copies to drift); these
# are force-included into nlfr/data/ at build time. Payload is tiny (~100 KiB of
# JSON + a minimal Bazel workspace).
[tool.hatch.build.targets.wheel.force-include]
"demo/scenarios" = "nlfr/data/scenarios"
"demo/bazel-monorepo" = "nlfr/data/demo-workspace"

[tool.hatch.build.targets.sdist]
# Leading-slash anchors keep the sdist minimal: gitignore-style patterns match
# at any depth, so a bare "README.md" would pull in every nested README.
include = [
  "/src/nlfr",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
  # Simulate demo fixtures: carried in the sdist so the wheel's force-include
  # (built from the sdist) can pull them into nlfr/data/ (GitHub #94).
  "/demo/scenarios",
  "/demo/bazel-monorepo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
