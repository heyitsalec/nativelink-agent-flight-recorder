# NLFR redact-gate — Buildkite plugin (issue #82).
#
# Same record -> redact-gate -> upload sequence as the GitHub Action, sharing
# the SAME core script (lib/nlfr-ci-gate.sh) so the redact-before-upload
# guarantee cannot drift between CI systems. The command hook records a Bazel
# build, gates the evidence through `nlfr redact`, and uploads ONLY the
# gate-blessed path with `buildkite-agent artifact upload` — never the raw tree
# unless `redact --check` passed.
#
# Usage in pipeline.yml:
#
#     steps:
#       - label: ":shield: nlfr proof"
#         plugins:
#           - nlfr-redact-gate#v0:
#               command: "bazel test //..."
#
name: nlfr-redact-gate
description: >-
  Record a Bazel build's evidence with NLFR and gate it through `nlfr redact`
  before uploading, so a raw evidence tree can never be published without
  passing the redaction boundary.
author: https://github.com/heyitsalec/nativelink-agent-flight-recorder
requirements:
  - bash
  - uvx
configuration:
  properties:
    command:
      type: string
      description: "The bazel command to wrap, e.g. 'bazel test //...'."
    run-group:
      type: string
      description: "Run-group label (default: the Buildkite build number)."
    output-dir:
      type: string
      description: "Directory for recorded SQLite / artifacts / projections."
    upload-artifact:
      type: boolean
      description: "Upload the gated evidence with buildkite-agent (default: true)."
    artifact-name:
      type: string
      description: "Reserved for parity with the GitHub Action; the Buildkite agent names artifacts by path."
    nlfr-version:
      type: string
      description: "Pin the PyPI version of nlfr (default: latest)."
    strict-redact:
      type: boolean
      description: >-
        true (default): fail the step on any redact finding OR any symlink in
        the evidence tree, before upload (the raw tree ships only when the gate
        could scan everything).
        false: scrub to a redacted mirror (which excludes symlinks) and upload
        only the mirror.
  required:
    - command
  additionalProperties: false
